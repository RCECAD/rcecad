services:
  db:
    image: postgres:16
    container_name: rcecad-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rcecad
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rcecad"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
